name: Security Audit

# Sprint 3 phase-05 (4-06): npm audit en CI. Falla build si hay High/Critical CVEs.
# Complementa el hook af-deps-guard.cjs (preventivo local) con verificación de CI.

on:
  push:
    branches: [developer, staging, main]
  pull_request:
    branches: [developer, staging, main]
  schedule:
    # Lunes 9:00 UTC: catch CVEs publicadas durante la semana en deps existentes.
    - cron: "0 9 * * 1"

jobs:
  audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (ci, locked)
        run: npm ci --ignore-scripts

      - name: npm audit (production only, fail on high/critical)
        # Gate determinista: parseamos el JSON y SOLO fallamos si hay high o
        # critical en deps de PRODUCCIÓN. No dependemos del exit code de
        # `npm audit`, cuyo comportamiento con --omit=dev + --audit-level varía
        # entre npm 10 y 11 (npm 10 hacía fallar el build con vulns moderate
        # pese a --audit-level=high). Las moderate residuales son acceptedRisk
        # documentadas en ADR-018 (next/postcss, exceljs/uuid: downgrades
        # breaking rechazados, inexplotables en nuestro uso).
        run: |
          set -o pipefail
          npm audit --omit=dev --json > audit-prod.json || true
          node -e '
            const a = require("./audit-prod.json");
            const v = a.metadata.vulnerabilities;
            console.log("Vulnerabilidades prod:", JSON.stringify(v));
            const blocking = (v.high || 0) + (v.critical || 0);
            if (blocking > 0) {
              console.error(`\n❌ ${blocking} vulnerabilidad(es) high/critical en deps de producción — bloquea.`);
              for (const [name, info] of Object.entries(a.vulnerabilities || {})) {
                if (info.severity === "high" || info.severity === "critical") {
                  console.error(`  - ${name} (${info.severity})`);
                }
              }
              process.exit(1);
            }
            console.log(`\n✅ 0 high/critical en producción (${v.moderate || 0} moderate acceptedRisk, ver ADR-018).`);
          '

      - name: npm audit (todas, info)
        if: always()
        continue-on-error: true
        run: npm audit
        # Reporta TODO sin fallar — útil para visibilidad sin bloquear.
