# ============================================================================
# CI guard: dos comprobaciones de salud del repo.
#
# 1. purity-check (staging/main):
#    Garantiza que staging/main NUNCA contengan docs/, plans/, .claude/,
#    .claude-plugin/, CLAUDE.md ni los README.{staging,main}.md sobrantes.
#
# 2. readme-sync-check (developer / feature/*):
#    Verifica que README.md, README.staging.md y README.main.md están
#    sincronizados con plans/RoadMap.md (single source of truth).
#    Si el RoadMap cambió y los READMEs no se regeneraron, el job falla.
# ============================================================================

name: Repo Purity Check

on:
  push:
    branches: [developer, staging, main, 'feature/**']
  pull_request:
    branches: [developer, staging, main]

jobs:
  purity-check:
    name: Verify no internal artifacts on protected branch
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'staging' ||
      github.base_ref == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden paths
        run: |
          FAIL=0
          FORBIDDEN=("docs" "plans" ".claude" ".claude-plugin" "CLAUDE.md")

          BRANCH="${GITHUB_REF##*/}"
          echo "Branch: $BRANCH"
          echo "Checking that none of these paths exist in the tree:"
          printf '  - %s\n' "${FORBIDDEN[@]}"
          echo ""

          for p in "${FORBIDDEN[@]}"; do
            if [ -e "$p" ]; then
              echo "::error::Forbidden path '$p' found on protected branch. Use scripts/promote.ps1 (or .sh) to promote cleanly from developer."
              FAIL=1
            fi
          done

          # Tambien rechazamos planes y dev-onboarding sueltos
          if [ -f "docs/dev-onboarding.md" ]; then
            echo "::error::docs/dev-onboarding.md should not exist on this branch."
            FAIL=1
          fi

          # README sobrantes de otras ramas (deberían haber sido renombrados por promote)
          if [[ "$BRANCH" == "staging" || "$BRANCH" == "main" ]]; then
            README_ARTIFACTS=("README.staging.md" "README.main.md")
            for f in "${README_ARTIFACTS[@]}"; do
              if [ -f "$f" ]; then
                echo "::error::File '$f' should not exist on branch '$BRANCH'. Promote script should have renamed it to README.md."
                FAIL=1
              fi
            done
          fi

          if [ $FAIL -eq 1 ]; then
            echo ""
            echo "How to fix:"
            echo "  1. Revert this commit/PR on staging/main."
            echo "  2. From developer branch, run:"
            echo "     ./scripts/promote.ps1 -From developer -To staging -Version X.Y.Z   (PowerShell)"
            echo "     ./scripts/promote.sh --from developer --to staging --version X.Y.Z (Bash)"
            echo "  3. The script removes docs/, plans/, .claude/, .claude-plugin/, CLAUDE.md automatically"
            echo "     and renames README.{staging,main}.md → README.md based on target branch."
            exit 1
          fi

          echo "OK — no forbidden paths found."

  readme-sync-check:
    name: Verify READMEs are in sync with RoadMap.md
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/developer' ||
      startsWith(github.ref, 'refs/heads/feature/') ||
      github.base_ref == 'developer'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check READMEs are in sync with plans/RoadMap.md
        run: node scripts/generate-readmes.cjs --check
