model_list:
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
  # Formato de fallbacks en LiteLLM v1.85+: lista de dicts {modelo: [alternativas]}.
  # El formato viejo lista-de-listas [["a","b"]] de v1.41 ya NO es válido y rompe
  # el arranque del proxy (validado en local, Sprint 8).
  fallbacks:
    - claude-3-5-sonnet-20241022: ["gpt-4o", "gemini-2.0-flash"]
    - gpt-4o: ["gemini-2.0-flash", "gpt-4o-mini"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
